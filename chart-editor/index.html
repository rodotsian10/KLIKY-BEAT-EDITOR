<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KLIKY-BEAT Standalone Chart Editor Studio</title>
  <style>
    :root {
      --bg-dark: #07080f;
      --bg-panel: #111322;
      --border-neon: rgba(0, 255, 255, 0.3);
      --neon-cyan: #00ffff;
      --neon-magenta: #ff007f;
      --neon-yellow: #ffff00;
      --neon-green: #39ff14;
      --text-gray: #8f93a7;
      --font-mono: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Left Sidebar: Controls & Audio */
    .sidebar-left {
      width: 320px;
      background-color: var(--bg-panel);
      border-right: 2px solid var(--border-neon);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    h2 {
      margin: 0 0 4px 0;
      font-family: var(--font-mono);
      font-size: 1.3rem;
      letter-spacing: 1px;
      background: linear-gradient(45deg, var(--neon-cyan), var(--neon-magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
    }

    .subtitle {
      font-size: 0.75rem;
      color: var(--text-gray);
      margin-bottom: 8px;
    }

    .control-group {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-gray);
    }

    select, input[type="number"], input[type="text"] {
      background: #191b2c;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #fff;
      padding: 5px 8px;
      font-size: 0.8rem;
      outline: none;
    }

    input[type="number"] {
      width: 80px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--neon-cyan);
    }

    /* Buttons */
    .btn {
      background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 127, 0.1));
      border: 1px solid var(--neon-cyan);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .btn:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 12px var(--neon-cyan);
    }

    .btn-record {
      border-color: var(--neon-magenta);
      color: var(--neon-magenta);
    }

    .btn-record.recording {
      background: var(--neon-magenta);
      color: #fff;
      box-shadow: 0 0 15px var(--neon-magenta);
      animation: blink-record 1s infinite alternate;
    }

    @keyframes blink-record {
      0% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .btn-test {
      border-color: var(--neon-green);
      color: var(--neon-green);
    }

    .btn-test:hover {
      background: var(--neon-green);
      color: #000;
      box-shadow: 0 0 15px var(--neon-green);
    }

    /* Center Main Layout */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #090b14;
      position: relative;
    }

    .editor-toolbar {
      height: 48px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-neon);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 16px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    .editor-body {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Center Timeline Grid & Visualizer */
    .grid-container {
      flex: 1;
      overflow-y: auto;
      position: relative;
      display: flex;
      justify-content: center;
      background: radial-gradient(circle at center, #101326 0%, #07080f 100%);
    }

    .grid-lane-wrapper {
      width: 280px;
      position: relative;
      border-left: 2px solid rgba(0, 255, 255, 0.2);
      border-right: 2px solid rgba(0, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.4);
    }

    .lane-divider {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    .lane-divider.lane-1 { left: 70px; }
    .lane-divider.lane-2 { left: 140px; }
    .lane-divider.lane-3 { left: 210px; }

    .playhead-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--neon-magenta);
      box-shadow: 0 0 10px var(--neon-magenta);
      z-index: 10;
      pointer-events: none;
    }

    .subdivision-line {
      position: absolute;
      left: 0;
      right: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.3);
      padding-left: 4px;
    }

    .subdivision-line.beat-main {
      border-bottom: 1px solid rgba(0, 255, 255, 0.3);
      color: var(--neon-cyan);
      font-weight: bold;
    }

    /* Note Blocks */
    .note-block {
      position: absolute;
      width: 48px;
      height: 14px;
      border-radius: 4px;
      box-shadow: 0 0 8px currentColor;
      cursor: pointer;
      z-index: 5;
      transition: transform 0.1s ease;
    }

    .note-block:hover {
      transform: scale(1.15);
      z-index: 8;
    }

    .note-block.lane-0 { background: var(--neon-cyan); color: var(--neon-cyan); }
    .note-block.lane-1 { background: var(--neon-magenta); color: var(--neon-magenta); }
    .note-block.lane-2 { background: var(--neon-yellow); color: var(--neon-yellow); }
    .note-block.lane-3 { background: var(--neon-green); color: var(--neon-green); }

    .hold-ribbon {
      position: absolute;
      width: 8px;
      background: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 10px currentColor;
      z-index: 4;
      pointer-events: none;
    }

    .hold-ribbon.lane-0 { background: var(--neon-cyan); color: var(--neon-cyan); }
    .hold-ribbon.lane-1 { background: var(--neon-magenta); color: var(--neon-magenta); }
    .hold-ribbon.lane-2 { background: var(--neon-yellow); color: var(--neon-yellow); }
    .hold-ribbon.lane-3 { background: var(--neon-green); color: var(--neon-green); }

    /* Right Sidebar: Vertical Inspection Roll */
    .sidebar-right {
      width: 300px;
      background: var(--bg-panel);
      border-left: 2px solid var(--border-neon);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .timeline-inspector {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
    }

    .inspector-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 4px;
      border-left: 3px solid #fff;
    }

    .inspector-item.lane-0 { border-left-color: var(--neon-cyan); }
    .inspector-item.lane-1 { border-left-color: var(--neon-magenta); }
    .inspector-item.lane-2 { border-left-color: var(--neon-yellow); }
    .inspector-item.lane-3 { border-left-color: var(--neon-green); }

    .del-btn {
      background: transparent;
      border: none;
      color: #ff3333;
      cursor: pointer;
      font-weight: bold;
    }

    /* Embedded Simulator Canvas Overlay */
    .sim-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .sim-overlay canvas {
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 20px var(--neon-cyan);
      border-radius: 8px;
    }

    textarea.json-box {
      width: 100%;
      height: 120px;
      background: #000;
      color: var(--neon-green);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 6px;
      resize: vertical;
    }
  </style>
</head>
<body>

  <!-- LEFT SIDEBAR: AUDIO & CONTROLS -->
  <div class="sidebar-left">
    <h2>🎛️ CHART STUDIO</h2>
    <div class="subtitle">KLIKY-BEAT Standalone Editor</div>

    <!-- 1. AUDIO SOURCE SELECT -->
    <div class="control-group">
      <div class="section-title">🎵 AUDIO TRACK SOURCE</div>
      <select id="audio-preset-select" style="width: 100%;">
        <option value="/my_heart.mp3">My Heart (Different Heaven)</option>
        <option value="/audio/canon_harp.dat">Canon in Harp (Neko Legends)</option>
        <option value="custom">📁 Custom MP3 / WAV Upload...</option>
      </select>
      <input type="file" id="audio-file-input" accept="audio/*" style="display: none; width: 100%; font-size: 0.75rem;" />
    </div>

    <!-- 2. RECORD & PLAYBACK -->
    <div class="control-group">
      <div class="section-title">🎙️ LIVE TAP RECORD & PLAY</div>
      <button class="btn btn-record" id="btn-toggle-record">
        🔴 LIVE RECORD (D/F/J/K)
      </button>
      <div class="control-row">
        <button class="btn" id="btn-play-pause" style="flex: 1;">▶ PLAY (Space)</button>
        <button class="btn btn-test" id="btn-test-play">🎮 TEST</button>
      </div>
      <div class="control-row">
        <label>TEMPO:</label>
        <select id="playback-rate">
          <option value="0.5">0.5x Slow</option>
          <option value="0.75">0.75x</option>
          <option value="1.0" selected>1.0x Normal</option>
          <option value="1.25">1.25x</option>
        </select>
      </div>
    </div>

    <!-- 3. BPM & SNAP -->
    <div class="control-group">
      <div class="section-title">⚙️ BPM & GRID SNAP</div>
      <div class="control-row">
        <label>BPM:</label>
        <input type="number" id="bpm-input" value="140" min="40" max="300" />
      </div>
      <div class="control-row">
        <label>SNAP:</label>
        <select id="snap-select">
          <option value="1">1/4 Beat</option>
          <option value="2" selected>1/8 Beat</option>
          <option value="4">1/16 Beat</option>
        </select>
      </div>
    </div>

    <!-- 4. JSON IMPORT & EXPORT -->
    <div class="control-group">
      <div class="section-title">💾 JSON IMPORT / EXPORT</div>
      <div class="control-row">
        <button class="btn" id="btn-export-json" style="flex: 1;">EXPORT</button>
        <button class="btn" id="btn-copy-json">COPY</button>
      </div>
      <textarea class="json-box" id="json-io" placeholder="Paste chart JSON here or click EXPORT..."></textarea>
      <button class="btn" id="btn-import-json">LOAD JSON INTO GRID</button>
    </div>
  </div>

  <!-- CENTER MAIN: TIMELINE GRID -->
  <div class="main-content">
    <div class="editor-toolbar">
      <span>TIME: <strong id="txt-current-time" style="color: var(--neon-cyan);">00:00.00</strong></span>
      <span>BEAT: <strong id="txt-current-beat" style="color: var(--neon-yellow);">0.00</strong></span>
      <span style="margin-left: auto; color: var(--text-gray); font-size: 0.75rem;">
        ⌨️ Shortcuts: [Space] Play/Pause | [←/→] ±1s | [D/F/J/K] Tap Note
      </span>
    </div>

    <div class="editor-body">
      <div class="grid-container" id="grid-container">
        <div class="grid-lane-wrapper" id="grid-lane-wrapper">
          <div class="lane-divider lane-1"></div>
          <div class="lane-divider lane-2"></div>
          <div class="lane-divider lane-3"></div>
          <div class="playhead-line" id="playhead"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT SIDEBAR: VERTICAL INSPECTION ROLL -->
  <div class="sidebar-right">
    <div class="section-title">📜 VERTICAL NOTE TIMELINE</div>
    <div style="font-size: 0.75rem; color: var(--text-gray);">
      TOTAL NOTES: <strong id="txt-total-notes" style="color: var(--neon-cyan);">0</strong>
    </div>

    <div class="timeline-inspector" id="inspector-list">
      <!-- Items dynamically populated -->
    </div>
  </div>

  <!-- IN-EDITOR TEST PLAY SIMULATOR OVERLAY -->
  <div class="sim-overlay" id="sim-overlay" style="display: none;">
    <h3 style="color: var(--neon-green); margin-bottom: 10px;">🎮 IN-EDITOR TEST PLAY</h3>
    <canvas id="sim-canvas" width="400" height="550"></canvas>
    <button class="btn" id="btn-close-sim" style="margin-top: 16px;">EXIT TEST PLAY</button>
  </div>

  <script>
    // Studio State
    let notesList = [
      { beat: 1.00, lane: 0, type: 'hold', durationBeats: 2.00 },
      { beat: 3.00, lane: 2, type: 'short' },
      { beat: 3.50, lane: 3, type: 'short' },
      { beat: 4.00, lane: 1, type: 'hold', durationBeats: 2.00 }
    ];

    let audio = new Audio('/my_heart.mp3');
    let bpm = 140;
    let beatSnap = 2; // 1/8 beat
    let isRecording = false;
    let recordingActiveHolds = {}; // Track hold start times per lane

    const laneKeys = ['KeyD', 'KeyF', 'KeyJ', 'KeyK'];
    const laneLabels = ['D (Lane 1)', 'F (Lane 2)', 'J (Lane 3)', 'K (Lane 4)'];

    // DOM Elements
    const audioSelect = document.getElementById('audio-preset-select');
    const audioFileInput = document.getElementById('audio-file-input');
    const btnPlayPause = document.getElementById('btn-play-pause');
    const btnToggleRecord = document.getElementById('btn-toggle-record');
    const btnTestPlay = document.getElementById('btn-test-play');
    const playbackRateSelect = document.getElementById('playback-rate');
    const bpmInput = document.getElementById('bpm-input');
    const snapSelect = document.getElementById('snap-select');
    const txtCurrentTime = document.getElementById('txt-current-time');
    const txtCurrentBeat = document.getElementById('txt-current-beat');
    const txtTotalNotes = document.getElementById('txt-total-notes');
    const gridWrapper = document.getElementById('grid-lane-wrapper');
    const playhead = document.getElementById('playhead');
    const inspectorList = document.getElementById('inspector-list');
    const jsonIO = document.getElementById('json-io');

    const pxPerBeat = 120; // 1 beat = 120px height

    // Audio Source Changing & Custom Upload
    audioSelect.addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === 'custom') {
        audioFileInput.click();
      } else {
        audio.src = val;
        audio.play();
      }
    });

    audioFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        audio.src = url;
        audio.play();
      }
    });

    // Playback Speed
    playbackRateSelect.addEventListener('change', (e) => {
      audio.playbackRate = parseFloat(e.target.value);
    });

    // Play / Pause Toggle
    btnPlayPause.addEventListener('click', togglePlay);
    function togglePlay() {
      if (audio.paused) {
        audio.play();
        btnPlayPause.innerHTML = '⏸ PAUSE (Space)';
      } else {
        audio.pause();
        btnPlayPause.innerHTML = '▶ PLAY (Space)';
      }
    }

    // Live Record Toggle
    btnToggleRecord.addEventListener('click', () => {
      isRecording = !isRecording;
      if (isRecording) {
        btnToggleRecord.classList.add('recording');
        btnToggleRecord.innerHTML = '🔴 RECORDING... (D/F/J/K)';
        if (audio.paused) audio.play();
      } else {
        btnToggleRecord.classList.remove('recording');
        btnToggleRecord.innerHTML = '🔴 LIVE RECORD (D/F/J/K)';
      }
    });

    // Keyboard Controls (Shortcuts & Live Recording)
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        audio.currentTime = Math.max(0, audio.currentTime - 1.0);
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 1.0);
      }

      // Live Recording Key Press
      const laneIndex = laneKeys.indexOf(e.code);
      if (laneIndex !== -1 && !e.repeat) {
        const secondsPerBeat = 60 / bpm;
        const currentBeat = audio.currentTime / secondsPerBeat;

        if (isRecording) {
          recordingActiveHolds[laneIndex] = currentBeat;
        } else {
          // Manual tap add short note
          notesList.push({
            beat: parseFloat(currentBeat.toFixed(2)),
            lane: laneIndex,
            type: 'short'
          });
          renderGrid();
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      const laneIndex = laneKeys.indexOf(e.code);
      if (laneIndex !== -1 && isRecording && recordingActiveHolds[laneIndex] !== undefined) {
        const secondsPerBeat = 60 / bpm;
        const currentBeat = audio.currentTime / secondsPerBeat;
        const startBeat = recordingActiveHolds[laneIndex];
        const duration = currentBeat - startBeat;

        if (duration > 0.25) {
          notesList.push({
            beat: parseFloat(startBeat.toFixed(2)),
            lane: laneIndex,
            type: 'hold',
            durationBeats: parseFloat(duration.toFixed(2))
          });
        } else {
          notesList.push({
            beat: parseFloat(startBeat.toFixed(2)),
            lane: laneIndex,
            type: 'short'
          });
        }
        delete recordingActiveHolds[laneIndex];
        renderGrid();
      }
    });

    // Render Timeline & Inspector
    function renderGrid() {
      // Clear existing elements
      const existing = gridWrapper.querySelectorAll('.note-block, .hold-ribbon, .subdivision-line');
      existing.forEach(e => e.remove());

      // Render grid lines for beats
      const maxBeat = 120;
      gridWrapper.style.height = (maxBeat * pxPerBeat) + 'px';

      for (let b = 0; b <= maxBeat; b += 0.5) {
        const line = document.createElement('div');
        line.className = `subdivision-line ${b % 1 === 0 ? 'beat-main' : ''}`;
        line.style.bottom = (b * pxPerBeat) + 'px';
        line.innerText = b % 1 === 0 ? `B ${b}` : '';
        gridWrapper.appendChild(line);
      }

      // Render notes
      notesList.sort((a, b) => a.beat - b.beat);
      notesList.forEach((note, idx) => {
        const bottomY = note.beat * pxPerBeat;
        const leftX = note.lane * 70 + 11;

        if (note.type === 'hold' && note.durationBeats) {
          const heightPx = note.durationBeats * pxPerBeat;
          const ribbon = document.createElement('div');
          ribbon.className = `hold-ribbon lane-${note.lane}`;
          ribbon.style.bottom = bottomY + 'px';
          ribbon.style.height = heightPx + 'px';
          ribbon.style.left = (note.lane * 70 + 31) + 'px';
          gridWrapper.appendChild(ribbon);
        }

        const block = document.createElement('div');
        block.className = `note-block lane-${note.lane}`;
        block.style.bottom = bottomY + 'px';
        block.style.left = leftX + 'px';

        block.addEventListener('click', (e) => {
          e.stopPropagation();
          notesList.splice(idx, 1);
          renderGrid();
        });

        gridWrapper.appendChild(block);
      });

      renderInspector();
    }

    // Render Right Vertical Inspection List
    function renderInspector() {
      inspectorList.innerHTML = '';
      txtTotalNotes.innerText = notesList.length;

      notesList.forEach((note, idx) => {
        const item = document.createElement('div');
        item.className = `inspector-item lane-${note.lane}`;
        item.innerHTML = `
          <div>
            <strong>[B ${note.beat.toFixed(2)}]</strong> Lane ${note.lane + 1} (${note.type.toUpperCase()})
            ${note.durationBeats ? ` (${note.durationBeats}b)` : ''}
          </div>
          <button class="del-btn" onclick="deleteNote(${idx})">✖</button>
        `;
        inspectorList.appendChild(item);
      });
    }

    window.deleteNote = function(idx) {
      notesList.splice(idx, 1);
      renderGrid();
    };

    // Update playhead on audio timeupdate
    audio.addEventListener('timeupdate', () => {
      const secondsPerBeat = 60 / bpm;
      const currentBeat = audio.currentTime / secondsPerBeat;
      const posY = currentBeat * pxPerBeat;

      playhead.style.bottom = posY + 'px';
      txtCurrentTime.innerText = formatTime(audio.currentTime);
      txtCurrentBeat.innerText = currentBeat.toFixed(2);
    });

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const ms = Math.floor((sec % 1) * 100);
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;
    }

    // JSON Export / Import
    document.getElementById('btn-export-json').addEventListener('click', () => {
      notesList.sort((a, b) => a.beat - b.beat);
      const formatted = notesList.map(n => {
        if (n.type === 'hold') {
          return `  { beat: ${n.beat.toFixed(2)}, lane: ${n.lane}, type: 'hold', durationBeats: ${n.durationBeats.toFixed(2)} }`;
        }
        return `  { beat: ${n.beat.toFixed(2)}, lane: ${n.lane}, type: 'short' }`;
      });
      jsonIO.value = `[\n${formatted.join(',\n')}\n]`;
    });

    document.getElementById('btn-copy-json').addEventListener('click', () => {
      if (!jsonIO.value) return alert('Export JSON first!');
      navigator.clipboard.writeText(jsonIO.value).then(() => alert('Copied JSON to clipboard!'));
    });

    document.getElementById('btn-import-json').addEventListener('click', () => {
      if (!jsonIO.value.trim()) return alert('Paste JSON text first!');
      try {
        const evaluator = new Function(`return ${jsonIO.value}`);
        const parsed = evaluator();
        if (!Array.isArray(parsed)) throw new Error('Not an array');
        notesList = parsed;
        renderGrid();
        alert('Successfully loaded chart array!');
      } catch (e) {
        alert('Invalid JSON format: ' + e.message);
      }
    });

    // In-Editor Test Play Simulator
    btnTestPlay.addEventListener('click', () => {
      document.getElementById('sim-overlay').style.display = 'flex';
      audio.currentTime = 0;
      audio.play();
    });

    document.getElementById('btn-close-sim').addEventListener('click', () => {
      document.getElementById('sim-overlay').style.display = 'none';
      audio.pause();
    });

    // Init
    renderGrid();
  </script>
</body>
</html>
